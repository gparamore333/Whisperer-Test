tasks.register('runAllOverlays', JavaExec) {
    group = 'runelite'
    description = 'Launches RuneLite locally with all overlay plugins registered.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.osrsoverlaytest.AllOverlaysTest'
    standardInput = System.in
    jvmArgs runeliteJvmArgs
}
