tasks.register('runCoxOverlay', JavaExec) {
    group = 'runelite'
    description = 'Launches RuneLite locally with the CoX Overlay plugin registered.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coxoverlay.CoxOverlayPluginTest'
